name: 가계부 이메일 자동 수집

# ⚠️ 정기 수집(cron)은 2026-09 로컬 모드 전환과 함께 제거했다.
# 수집은 PC에서 실행한다 (scripts/run_local_fetch.py + Windows 작업 스케줄러,
# README-LOCAL.md 참고). 클라우드와 PC가 동시에 돌면 먼저 처리한 쪽이 메일을
# '처리완료'로 옮겨버려 다른 쪽은 그 거래를 영영 못 본다 — 실제로 8월에
# 클라우드가 가져간 거래가 구글 시트에만 남았다 (scripts/sync_sheet_to_local.py로 회수).
# 아래 수동 실행은 PC를 못 쓸 때를 위한 비상용으로만 남겨둔다.
on:
  workflow_dispatch:       # 수동 실행 버튼 (비상용)
    inputs:
      lookback_hours:
        description: '검색 기간 (시간). 1일 1회 cron 기준 기본 26시간. 누적 메일 일회 정리 시 720(30일) 권장'
        required: false
        default: '26'
      kakao_password:
        description: '카뱅 xlsx 비밀번호 (일회용 대체). KAKAO_XLSX_PASSWORD 시크릿이 등록되면 불필요 — 시크릿이 항상 우선'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Tesseract 한국어 OCR 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: 의존성 설치
        # requirements.txt 전체 설치 — PR CI(test.yml)와 동일한 의존성 셋.
        # 가벼운 부분집합만 설치하던 과거 방식은 cron 환경 ≠ test 환경
        # 갭으로 ModuleNotFoundError 회귀 위험 (PR #28 핫픽스 참고).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 파서 단위 테스트
        run: python scripts/test_email_parser.py

      - name: 일회용 비밀번호 마스킹
        # kakao_password 입력값이 이후 스텝의 env 헤더·로그에 평문 노출되지
        # 않게 먼저 마스킹. 값을 셸 표현식으로 전개하면 run 커맨드 에코에
        # 노출되므로 이벤트 JSON 파일에서 직접 읽는다.
        if: github.event_name == 'workflow_dispatch'
        run: |
          pw=$(jq -r '.inputs.kakao_password // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$pw" ]; then echo "::add-mask::$pw"; fi

      - name: 이메일 파싱 실행
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PW: ${{ secrets.NAVER_APP_PW }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          BC_PDF_PASSWORD: ${{ secrets.BC_PDF_PASSWORD }}
          KAKAO_XLSX_PASSWORD: ${{ secrets.KAKAO_XLSX_PASSWORD || github.event.inputs.kakao_password }}
          ENABLE_EMAIL_CLEANUP: "true"
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '26' }}
          STATEMENT_LOOKBACK_DAYS: "35"
        run: python scripts/email_parser.py

      - name: 실패 시 슬랙 알림 (직전 실패와 같은 커밋이면 dedup)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 스킵"
            exit 0
          fi
          # 직전 5개 cron 실행 중 같은 커밋에서 failure가 있었으면 알림 스킵
          # (같은 sha 반복 실패 시 매시간 알림 폭주 방지)
          prev_failures=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/fetch_emails.yml/runs?per_page=6" \
            --jq '.workflow_runs | map(select(.id != ${{ github.run_id }})) | .[0:5] | map(select(.conclusion == "failure" and .head_sha == "${{ github.sha }}")) | length')
          if [ "$prev_failures" -gt 0 ]; then
            echo "직전 5개 run 중 같은 커밋 (${{ github.sha }})에서 failure 이미 ${prev_failures}회 — 알림 dedup 스킵"
            exit 0
          fi
          curl -s -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \":x: *가계부 cron 실패* — workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
